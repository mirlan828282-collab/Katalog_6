name: Build Kartoteka Local 1.3.0

on:
  workflow_dispatch:
  push:
    branches: [ kartoteka-local-v1.3.0 ]
    paths:
      - 'kartoteka_v130_source/**'
      - '.github/workflows/build-kartoteka-local-v1.3.0.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v1.3.0 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'kartoteka_v130_source/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Kartoteka_Local_v1.3.0_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'Kartoteka_Local_v1.3.0_source.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne '68d958a2ae52b00ca037867e3bf51169bcf55dec2dc31e14d1131ce84d5d60f4') {
            throw "Source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force 'Kartoteka_Local_v1.3.0' | Out-Null
          Expand-Archive 'Kartoteka_Local_v1.3.0_source.zip' -DestinationPath 'Kartoteka_Local_v1.3.0' -Force
          if (!(Test-Path 'Kartoteka_Local_v1.3.0/main.py')) { throw 'main.py missing' }

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: python -m compileall -q kartoteka main.py

      - name: Unit and migration tests
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: python -m pytest -q

      - name: Import smoke test
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: python -c "from kartoteka.app import App; from kartoteka.centrasia import CentrasiaClient; from kartoteka.services import split_fio; assert split_fio('Кулов Феликс Шаршенбаевич') == ('Кулов','Феликс','Шаршенбаевич'); print('import smoke: OK')"

      - name: Verify release metadata and requested defaults
        working-directory: Kartoteka_Local_v1.3.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $init = Get-Content 'kartoteka/__init__.py' -Raw -Encoding UTF8
          $app = Get-Content 'kartoteka/app.py' -Raw -Encoding UTF8
          $iss = Get-Content 'installer/Kartoteka.iss' -Raw -Encoding UTF8
          if ($init -notmatch 'APP_VERSION = "1\.3\.0"') { throw 'Wrong app version' }
          if ($init -notmatch 'CREATOR = "Esenbekov M\."') { throw 'Wrong creator' }
          if ($app -notmatch 'Кыргызская Республика') { throw 'Default country missing' }
          if ($app -notmatch '<F5>') { throw 'F5 refresh binding missing' }
          if ($app -notmatch 'CentrAsia — страны и списки') { throw 'CentrAsia country directory missing' }
          if ($iss -notmatch 'MyAppVersion "1\.3\.0"') { throw 'Installer version mismatch' }
          Write-Host 'release metadata: OK'

      - name: Build Kartoteka.exe
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Verify executable
        working-directory: Kartoteka_Local_v1.3.0
        shell: powershell
        run: |
          $p='dist/Kartoteka.exe'
          if (!(Test-Path $p)) { throw 'Kartoteka.exe not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Normalize installer script encoding
        working-directory: Kartoteka_Local_v1.3.0
        shell: powershell
        run: |
          $p = Resolve-Path 'installer/Kartoteka.iss'
          $txt = [IO.File]::ReadAllText($p, [Text.Encoding]::UTF8).TrimStart([char]0xFEFF)
          [IO.File]::WriteAllText($p, $txt, (New-Object Text.UTF8Encoding($true)))

      - name: Build installer
        working-directory: Kartoteka_Local_v1.3.0
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        working-directory: Kartoteka_Local_v1.3.0
        shell: powershell
        run: |
          $p='installer_output/Kartoteka_Setup_v1.3.0_Win7-11_x64.exe'
          if (!(Test-Path $p)) { throw 'Installer not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.3.0_Win7-11_x64
          path: Kartoteka_Local_v1.3.0/installer_output/Kartoteka_Setup_v1.3.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Local_v1.3.0_source
          path: Kartoteka_Local_v1.3.0_source.zip
          if-no-files-found: error
          retention-days: 30
