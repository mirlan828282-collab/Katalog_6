name: Build Kartoteka Local 1.2.1

on:
  push:
    branches: [ kartoteka-local-v1.2.1 ]
    paths:
      - '.github/workflows/build-kartoteka-local-v1.2.1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.2 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'kartoteka_v1_2_source/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Kartoteka_Local_v1.2.0_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'Kartoteka_Local_v1.2.0_source.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '81895af15522628ae1e6bc95f3bb271e22a4a3a54889a4d2f2565c5722bda1c1') { throw "Source checksum mismatch: $hash" }
          Expand-Archive 'Kartoteka_Local_v1.2.0_source.zip' -DestinationPath '.' -Force
          Rename-Item 'Kartoteka_Local_v1.2.0' 'Kartoteka_Local_v1.2.1'
          if (!(Test-Path 'Kartoteka_Local_v1.2.1/main.py')) { throw 'main.py missing' }

      - name: Replace CentrAsia engine
        shell: powershell
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes('Kartoteka_Local_v1.2.1/kartoteka/centrasia.py', [Convert]::FromBase64String($b64))
          $test = ''
          [IO.File]::WriteAllBytes('Kartoteka_Local_v1.2.1/tests/test_centrasia_legacy.py', [Convert]::FromBase64String($test))

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Apply v1.2.1 compatibility patches
        shell: powershell
        run: |
          @'
          from pathlib import Path

          root = Path("Kartoteka_Local_v1.2.1")

          p = root / "kartoteka" / "services.py"
          s = p.read_text(encoding="utf-8")
          if "wb.close()" not in s:
              needle = "    raw = [tuple(r) for r in ws.iter_rows(values_only=True)]"
              if needle not in s:
                  raise RuntimeError("Excel patch target not found")
              s = s.replace(needle, needle + "\n    wb.close()", 1)
              p.write_text(s, encoding="utf-8")

          p = root / "kartoteka" / "app.py"
          s = p.read_text(encoding="utf-8")
          s = s.replace("def fail():\n                    self.import_running = False", "def fail(message=str(e) or repr(e)):\n                    self.import_running = False")
          s = s.replace('messagebox.showerror("CentrAsia", str(e))', 'messagebox.showerror("CentrAsia", message)')
          s = s.replace('webbrowser.open("https://centrasia.org/search.php?st=" + query.replace(" ", "+"))',
                        'webbrowser.open("https://www.google.com/search?q=site%3Acentrasia.org%2Fperson2.php+" + query.replace(" ", "+"))')
          p.write_text(s, encoding="utf-8")

          for rel in ["kartoteka/__init__.py", "README.md", "installer/Kartoteka.iss"]:
              p = root / rel
              enc = "utf-8-sig" if rel.endswith(".iss") else "utf-8"
              s = p.read_text(encoding=enc).replace("1.2.0", "1.2.1")
              p.write_text(s, encoding=enc)
          '@ | Set-Content -Encoding UTF8 patch_v121.py
          python patch_v121.py
          Remove-Item patch_v121.py

      - name: Install dependencies
        working-directory: Kartoteka_Local_v1.2.1
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: Kartoteka_Local_v1.2.1
        shell: cmd
        run: python -m compileall -q kartoteka main.py

      - name: Unit tests
        working-directory: Kartoteka_Local_v1.2.1
        shell: cmd
        run: python -m pytest -q

      - name: Build Kartoteka.exe
        working-directory: Kartoteka_Local_v1.2.1
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Normalize installer encoding
        working-directory: Kartoteka_Local_v1.2.1
        shell: powershell
        run: |
          $p = Resolve-Path 'installer/Kartoteka.iss'
          $txt = [IO.File]::ReadAllText($p, [Text.Encoding]::UTF8).TrimStart([char]0xFEFF)
          [IO.File]::WriteAllText($p, $txt, (New-Object Text.UTF8Encoding($true)))

      - name: Build installer
        working-directory: Kartoteka_Local_v1.2.1
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        working-directory: Kartoteka_Local_v1.2.1
        shell: powershell
        run: |
          $p='installer_output/Kartoteka_Setup_v1.2.1_Win7-11_x64.exe'
          if (!(Test-Path $p)) { throw 'Installer not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.2.1_Win7-11_x64
          path: Kartoteka_Local_v1.2.1/installer_output/Kartoteka_Setup_v1.2.1_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
