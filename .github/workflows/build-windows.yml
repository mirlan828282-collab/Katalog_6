name: Build PhotoArchiveCatalog Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_VERSION: "6.0.8"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare v6.0.8 final corrected source
        shell: powershell
        run: |
          $partNames = @(
            ".build\v608\payload_01.txt",
            ".build\v608\payload_02.txt",
            ".build\v608\payload_03.txt",
            ".build\v608\payload_04.txt",
            ".build\v608\payload_05.txt"
          )
          foreach ($p in $partNames) {
            if (!(Test-Path $p)) { throw "Missing payload chunk: $p" }
          }
          $b64 = ($partNames | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:RUNNER_TEMP "v608_source.zip"
          [IO.File]::WriteAllBytes($zip, $bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "0046cf283a349819b455d1f2da59dde6ca619f5da40a7ba900b372a756085ef2") { throw "Payload SHA256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath . -Force
          if (!(Test-Path "main.py")) { throw "main.py was not extracted" }

          $patchNames = @(
            ".build\v608\fix_01.patch",
            ".build\v608\fix_02.patch",
            ".build\v608\fix_03.patch",
            ".build\v608\fix_04.patch",
            ".build\v608\fix_05.patch",
            ".build\v608\fix_06.patch"
          )
          foreach ($p in $patchNames) {
            if (!(Test-Path $p)) { throw "Missing correction patch: $p" }
          }
          $patchText = ($patchNames | ForEach-Object { Get-Content $_ -Raw -Encoding UTF8 }) -join ""
          # Git for Windows checks text files out with CRLF. Normalize the patch to LF
          # because main.py inside the source ZIP uses LF line endings.
          $patchText = $patchText.Replace("`r`n", "`n").Replace("`r", "`n")
          $patchFile = Join-Path $env:RUNNER_TEMP "v608_final_correction.patch"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($patchFile, $patchText, $utf8NoBom)
          git apply --check --ignore-space-change --ignore-whitespace $patchFile
          if ($LASTEXITCODE -ne 0) { throw "Correction patch check failed" }
          git apply --whitespace=nowarn --ignore-space-change --ignore-whitespace $patchFile
          if ($LASTEXITCODE -ne 0) { throw "Correction patch failed" }
          Write-Host "Final v6.0.8 corrections applied"
          Get-Content version.txt

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
          cache: 'pip'

      - name: Validate Python source
        run: python -m py_compile main.py updater.py face_engine.py download_models.py

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Normalize Windows application icon
        shell: powershell
        run: |
          @'
          from PIL import Image
          from pathlib import Path
          p = Path('assets/program_icon.png')
          if not p.exists():
              raise SystemExit('assets/program_icon.png not found')
          im = Image.open(p).convert('RGBA')
          im.save('assets/program_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('Windows multi-size ICO rebuilt successfully')
          '@ | python -

      - name: Download face models and state-symbol images
        run: python download_models.py

      - name: Build main program
        shell: cmd
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PhotoArchiveCatalog
          --icon "assets\program_icon.ico"
          --add-data "models;models"
          --add-data "assets;assets"
          --hidden-import cv2
          --hidden-import numpy
          --hidden-import openpyxl
          --hidden-import docx
          --hidden-import pyodbc
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import pywintypes
          --collect-all openpyxl
          --collect-submodules win32com
          main.py

      - name: Build updater
        shell: cmd
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --uac-admin
          --name PhotoArchiveCatalogUpdater
          --icon "assets\program_icon.ico"
          updater.py

      - name: Verify EXE files
        shell: powershell
        run: |
          if (!(Test-Path "dist/PhotoArchiveCatalog.exe")) { throw "Main EXE was not created" }
          if (!(Test-Path "dist/PhotoArchiveCatalogUpdater.exe")) { throw "Updater EXE was not created" }
          Get-Item "dist/PhotoArchiveCatalog.exe", "dist/PhotoArchiveCatalogUpdater.exe" | Format-Table Name,Length,FullName

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $iss = Get-Content "installer.iss" -Raw -Encoding UTF8
          $iss = $iss -replace '(?m)^SetupIconFile=.*\r?\n?', ''
          $utf8bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText((Resolve-Path "installer.iss").Path, $iss, $utf8bom)
          Write-Host "installer.iss normalized to UTF-8 BOM; Russian installer strings preserved"
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Build ZIP update package
        shell: powershell
        run: |
          $version=(Get-Content version.txt -Raw).Trim()
          New-Item -ItemType Directory -Force -Path update_package | Out-Null
          Copy-Item dist\PhotoArchiveCatalog.exe update_package\PhotoArchiveCatalog.exe
          Copy-Item dist\PhotoArchiveCatalogUpdater.exe update_package\PhotoArchiveCatalogUpdater.exe
          Copy-Item assets\program_icon.ico update_package\program_icon.ico
          @{ app="PhotoArchiveCatalog"; version=$version; created=(Get-Date).ToString("s") } | ConvertTo-Json | Set-Content -Encoding UTF8 update_package\update_manifest.json
          Compress-Archive -Path update_package\* -DestinationPath "PhotoArchiveCatalog_Update_v$version.zip" -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoArchiveCatalog-Installer-v${{ env.APP_VERSION }}
          path: installer_output/PhotoArchiveCatalog_Setup_v*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: PhotoArchiveCatalog-Update-v${{ env.APP_VERSION }}
          path: PhotoArchiveCatalog_Update_v*.zip
          if-no-files-found: error
          retention-days: 30
