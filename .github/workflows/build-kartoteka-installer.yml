name: Build Kartoteka Installer

on:
  push:
    branches: [ kartoteka-build ]
    paths:
      - 'kartoteka_build/**'
      - '.github/workflows/build-kartoteka-installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: powershell
        run: |
          $parts = Get-ChildItem 'kartoteka_build/source_b64/part*.txt' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('kartoteka_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'kartoteka_source.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          if ($hash -ne 'b658a3622a46c832c42f5c762623e8b4c5065e5dfa35ab387ee25cc392add745') {
            throw "Source archive checksum mismatch"
          }
          Expand-Archive 'kartoteka_source.zip' -DestinationPath 'kartoteka_src' -Force

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: python -m compileall -q kartoteka main.py server_main.py

      - name: Unit tests
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: python -m pytest -q

      - name: Build Kartoteka.exe
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Build KartotekaServer.exe
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: pyinstaller --clean --noconfirm KartotekaServer.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Rebuild valid Inno Setup script
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: powershell
        run: |
          $iss = @'
          #define MyAppName "Картотека"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Mirlan"
          #define MyAppExeName "Kartoteka.exe"

          [Setup]
          AppId={{B7BA4E70-C815-4D15-9DDD-4D5370B62244}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Kartoteka
          DefaultGroupName=Картотека
          OutputDir=..\installer_output
          OutputBaseFilename=Kartoteka_Setup_v1.0.0_Win7-11_x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayName=Картотека
          WizardStyle=modern

          [Types]
          Name: "server"; Description: "Основной компьютер — сервер + клиент"
          Name: "client"; Description: "Рабочее место — только клиент"

          [Components]
          Name: "client"; Description: "Клиент Картотека"; Types: server client; Flags: fixed
          Name: "server"; Description: "Сервер Картотека"; Types: server

          [Files]
          Source: "..\dist\Kartoteka.exe"; DestDir: "{app}"; Components: client; Flags: ignoreversion
          Source: "..\dist\KartotekaServer.exe"; DestDir: "{app}"; Components: server; Flags: ignoreversion

          [Dirs]
          Name: "{commonappdata}\Kartoteka\data"
          Name: "{commonappdata}\Kartoteka\data\photos"
          Name: "{commonappdata}\Kartoteka\data\thumbnails"
          Name: "{commonappdata}\Kartoteka\backups"
          Name: "{commonappdata}\Kartoteka\logs"

          [Icons]
          Name: "{autoprograms}\Картотека"; Filename: "{app}\Kartoteka.exe"
          Name: "{autodesktop}\Картотека"; Filename: "{app}\Kartoteka.exe"

          [Run]
          Filename: "{app}\KartotekaServer.exe"; Description: "Запустить сервер Картотека"; Components: server; Flags: nowait postinstall skipifsilent
          Filename: "{app}\Kartoteka.exe"; Description: "Запустить Картотеку"; Components: client; Flags: nowait postinstall skipifsilent

          [Code]
          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
          begin
            if (CurStep = ssPostInstall) and WizardIsComponentSelected('server') then
            begin
              Exec('netsh', 'advfirewall firewall add rule name="Kartoteka Server 8765" dir=in action=allow protocol=TCP localport=8765', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            end;
          end;
          '@
          $iss = ($iss -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          $utf8 = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'installer\Kartoteka.iss'), $iss, $utf8)
          Write-Host 'First lines of generated installer script:'
          Get-Content 'installer\Kartoteka.iss' -TotalCount 8

      - name: Build installer
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $setup = 'kartoteka_src/Kartoteka_v1.0.0/installer_output/Kartoteka_Setup_v1.0.0_Win7-11_x64.exe'
          if (!(Test-Path $setup)) { throw 'Installer was not created' }
          Get-Item $setup | Format-List Name,Length,FullName
          Get-FileHash $setup -Algorithm SHA256

      - name: Upload ready installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.0.0_Win7-11_x64
          path: kartoteka_src/Kartoteka_v1.0.0/installer_output/Kartoteka_Setup_v1.0.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
