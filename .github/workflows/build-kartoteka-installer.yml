name: Build Kartoteka Installer

on:
  push:
    branches: [ kartoteka-build ]
    paths:
      - 'kartoteka_build/**'
      - '.github/workflows/build-kartoteka-installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: powershell
        run: |
          $parts = Get-ChildItem 'kartoteka_build/source_b64/part*.txt' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('kartoteka_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'kartoteka_source.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          if ($hash -ne 'b658a3622a46c832c42f5c762623e8b4c5065e5dfa35ab387ee25cc392add745') {
            throw "Source archive checksum mismatch"
          }
          Expand-Archive 'kartoteka_source.zip' -DestinationPath 'kartoteka_src' -Force

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: python -m compileall -q kartoteka main.py server_main.py

      - name: Unit tests
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: pytest -q

      - name: Build Kartoteka.exe
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Build KartotekaServer.exe
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: pyinstaller --clean --noconfirm KartotekaServer.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: kartoteka_src/Kartoteka_v1.0.0
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $setup = 'kartoteka_src/Kartoteka_v1.0.0/installer_output/Kartoteka_Setup_v1.0.0_Win7-11_x64.exe'
          if (!(Test-Path $setup)) { throw 'Installer was not created' }
          Get-Item $setup | Format-List Name,Length,FullName
          Get-FileHash $setup -Algorithm SHA256

      - name: Upload ready installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.0.0_Win7-11_x64
          path: kartoteka_src/Kartoteka_v1.0.0/installer_output/Kartoteka_Setup_v1.0.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
