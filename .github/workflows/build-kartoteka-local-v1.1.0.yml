name: Build Kartoteka Local 1.1.0

on:
  push:
    branches: [ kartoteka-local-v1.1.0 ]
    paths:
      - 'kartoteka_local_v1.1.0.zip'
      - '.github/workflows/build-kartoteka-local-v1.1.0.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: powershell
        run: |
          if (!(Test-Path 'kartoteka_local_v1.1.0.zip')) { throw 'Source archive missing' }
          Expand-Archive 'kartoteka_local_v1.1.0.zip' -DestinationPath 'kartoteka_local' -Force
          if (!(Test-Path 'kartoteka_local/main.py')) { throw 'main.py missing after extraction' }

      - name: Replace corrected services module
        shell: powershell
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes('kartoteka_local/kartoteka/services.py', [Convert]::FromBase64String($b64))
          Write-Host 'Corrected services.py written'

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: kartoteka_local
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: kartoteka_local
        shell: cmd
        run: python -m compileall -q kartoteka main.py

      - name: Unit tests
        working-directory: kartoteka_local
        shell: cmd
        run: python -m pytest -q

      - name: Build Kartoteka.exe
        working-directory: kartoteka_local
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Rebuild installer script safely
        working-directory: kartoteka_local
        shell: powershell
        run: |
          $iss = @'
          #define MyAppName "Картотека"
          #define MyAppVersion "1.1.0"
          #define MyAppPublisher "Esenbekov M."
          #define MyAppExeName "Kartoteka.exe"

          [Setup]
          AppId={{A7F1F69B-92B2-48BC-A729-2310A2E42375}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoDescription=КАРТОТЕКА — база данных персон
          DefaultDirName={autopf}\Kartoteka
          DefaultGroupName=Картотека
          OutputDir=..\installer_output
          OutputBaseFilename=Kartoteka_Setup_v1.1.0_Win7-11_x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayName=Картотека
          WizardStyle=modern

          [Files]
          Source: "..\dist\Kartoteka.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Dirs]
          Name: "{commonappdata}\Kartoteka\data"
          Name: "{commonappdata}\Kartoteka\backups"
          Name: "{commonappdata}\Kartoteka\logs"

          [Icons]
          Name: "{autoprograms}\Картотека"; Filename: "{app}\Kartoteka.exe"
          Name: "{autodesktop}\Картотека"; Filename: "{app}\Kartoteka.exe"

          [Run]
          Filename: "{app}\Kartoteka.exe"; Description: "Запустить Картотеку"; Flags: nowait postinstall skipifsilent
          '@
          $iss = ($iss -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          $enc = New-Object System.Text.UTF8Encoding($true)
          [IO.File]::WriteAllText((Resolve-Path 'installer/Kartoteka.iss').Path, $iss, $enc)
          Get-Content 'installer/Kartoteka.iss' -TotalCount 8

      - name: Build installer
        working-directory: kartoteka_local
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        working-directory: kartoteka_local
        shell: powershell
        run: |
          $p='installer_output/Kartoteka_Setup_v1.1.0_Win7-11_x64.exe'
          if (!(Test-Path $p)) { throw 'Installer not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.1.0_Win7-11_x64
          path: kartoteka_local/installer_output/Kartoteka_Setup_v1.1.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
