name: Build Kartoteka Local 1.1.0

on:
  push:
    branches: [ kartoteka-local-v1.1.0 ]
    paths:
      - 'kartoteka_local_v1.1.0.zip'
      - '.github/workflows/build-kartoteka-local-v1.1.0.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: powershell
        run: |
          if (!(Test-Path 'kartoteka_local_v1.1.0.zip')) { throw 'Source archive missing' }
          Expand-Archive 'kartoteka_local_v1.1.0.zip' -DestinationPath 'kartoteka_local' -Force
          if (!(Test-Path 'kartoteka_local/main.py')) { throw 'main.py missing after extraction' }

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: kartoteka_local
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: kartoteka_local
        shell: cmd
        run: python -m compileall -q kartoteka main.py

      - name: Unit tests
        working-directory: kartoteka_local
        shell: cmd
        run: python -m pytest -q

      - name: Build Kartoteka.exe
        working-directory: kartoteka_local
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Normalize installer UTF-8 BOM
        working-directory: kartoteka_local
        shell: powershell
        run: |
          $p = Resolve-Path 'installer/Kartoteka.iss'
          $txt = Get-Content $p -Raw -Encoding UTF8
          $txt = $txt.TrimStart([char]0xFEFF)
          $enc = New-Object System.Text.UTF8Encoding($true)
          [IO.File]::WriteAllText($p, $txt, $enc)
          Get-Content $p -TotalCount 5

      - name: Build installer
        working-directory: kartoteka_local
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        working-directory: kartoteka_local
        shell: powershell
        run: |
          $p='installer_output/Kartoteka_Setup_v1.1.0_Win7-11_x64.exe'
          if (!(Test-Path $p)) { throw 'Installer not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.1.0_Win7-11_x64
          path: kartoteka_local/installer_output/Kartoteka_Setup_v1.1.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
