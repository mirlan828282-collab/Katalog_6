name: Inspect Kartoteka employment

on:
  workflow_dispatch:
  push:
    branches: [ kartoteka-local-v1.2.1 ]
    paths: [ '.github/workflows/inspect-kartoteka-employment.yml' ]

jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: powershell
        run: |
          $parts = Get-ChildItem 'kartoteka_v1_2_source/part*.txt' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('src.zip', [Convert]::FromBase64String($b64))
          Expand-Archive 'src.zip' -DestinationPath '.' -Force
      - name: Show employment schema and repository methods
        shell: powershell
        run: |
          Write-Host '=== DATABASE EMPLOYMENT SCHEMA ==='
          $db = Get-Content 'Kartoteka_Local_v1.2.0/kartoteka/database.py'
          for ($i=0; $i -lt $db.Count; $i++) {
            if ($db[$i] -match 'CREATE TABLE.*employment|created_at|updated_at') {
              $a=[Math]::Max(0,$i-5); $b=[Math]::Min($db.Count-1,$i+18)
              for($j=$a;$j -le $b;$j++){ Write-Host (($j+1).ToString()+': '+$db[$j]) }
            }
          }
          Write-Host '=== REPOSITORY LINES 135-170 ==='
          $r = Get-Content 'Kartoteka_Local_v1.2.0/kartoteka/repository.py'
          for($j=134;$j -lt [Math]::Min(170,$r.Count);$j++){ Write-Host (($j+1).ToString()+': '+$r[$j]) }
