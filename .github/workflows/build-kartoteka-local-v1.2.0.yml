name: Build Kartoteka Local 1.2.0

on:
  push:
    branches: [ kartoteka-local-v1.2.0 ]
    paths:
      - 'kartoteka_v1_2_source/**'
      - '.github/workflows/build-kartoteka-local-v1.2.0.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'kartoteka_v1_2_source/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Kartoteka_Local_v1.2.0_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'Kartoteka_Local_v1.2.0_source.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne '81895af15522628ae1e6bc95f3bb271e22a4a3a54889a4d2f2565c5722bda1c1') {
            throw "Source checksum mismatch"
          }
          Expand-Archive 'Kartoteka_Local_v1.2.0_source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'Kartoteka_Local_v1.2.0/main.py')) { throw 'main.py missing after extraction' }

      - name: Setup Python 3.7.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: Kartoteka_Local_v1.2.0
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24"
          pip install -r requirements.txt

      - name: Compile check
        working-directory: Kartoteka_Local_v1.2.0
        shell: cmd
        run: python -m compileall -q kartoteka main.py

      - name: Unit tests
        working-directory: Kartoteka_Local_v1.2.0
        shell: cmd
        run: python -m pytest -q

      - name: Build Kartoteka.exe
        working-directory: Kartoteka_Local_v1.2.0
        shell: cmd
        run: pyinstaller --clean --noconfirm Kartoteka.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Normalize installer UTF-8 BOM
        working-directory: Kartoteka_Local_v1.2.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Resolve-Path 'installer/Kartoteka.iss'
          $txt = [IO.File]::ReadAllText($p, [Text.Encoding]::UTF8)
          $txt = $txt.TrimStart([char]0xFEFF)
          $enc = New-Object System.Text.UTF8Encoding($true)
          [IO.File]::WriteAllText($p, $txt, $enc)
          Get-Content $p -TotalCount 12

      - name: Build installer
        working-directory: Kartoteka_Local_v1.2.0
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Kartoteka.iss'

      - name: Verify installer
        working-directory: Kartoteka_Local_v1.2.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'installer_output/Kartoteka_Setup_v1.2.0_Win7-11_x64.exe'
          if (!(Test-Path $p)) { throw 'Installer not created' }
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.2.0_Win7-11_x64
          path: Kartoteka_Local_v1.2.0/installer_output/Kartoteka_Setup_v1.2.0_Win7-11_x64.exe
          if-no-files-found: error
          retention-days: 30
