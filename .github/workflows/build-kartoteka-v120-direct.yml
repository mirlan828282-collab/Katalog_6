name: Build Kartoteka v1.2.0 Direct

on:
  push:
    branches:
      - kartoteka-v1.2.0-direct
    paths:
      - 'Kartoteka_v1.2.0_source.zip'
      - '.github/workflows/build-kartoteka-v120-direct.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'Kartoteka_v1.2.0_source.zip'
          if (-not (Test-Path $zip)) { throw 'Source ZIP not found' }
          $expected = 'd1fe810b757ac7b17ff91fab2a3d2bd1b9ac7f9f6a64733b19778a0a4c34a579'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $actual"
          if ($actual -ne $expected) { throw "Source ZIP checksum mismatch: $actual" }
          if (Test-Path 'Kartoteka') { Remove-Item 'Kartoteka' -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $PWD -Force
          $required = @('Kartoteka\client.py','Kartoteka\server.py','Kartoteka\bulk_centrasia.py','Kartoteka\centrasia_tools.py','Kartoteka\self_test.py','Kartoteka\test_centrasia_parser.py','Kartoteka\uninstall_launcher.py','Kartoteka\installer\Kartoteka.iss')
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Missing source file: $f" } }
          if ((Get-Content 'Kartoteka\client.py' -Raw) -notmatch 'APP_VERSION\s*=\s*"1\.2\.0"') { throw 'Wrong client version' }
          Write-Host 'Source verification passed'

      - name: Set up Windows 7 compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install Pillow==9.5.0 openpyxl==3.0.10 PyInstaller==5.13.2

      - name: Compile and test sources
        shell: pwsh
        run: |
          python -m py_compile Kartoteka\client.py Kartoteka\server.py Kartoteka\bulk_centrasia.py Kartoteka\centrasia_tools.py Kartoteka\self_test.py Kartoteka\test_centrasia_parser.py Kartoteka\uninstall_launcher.py
          python Kartoteka\test_centrasia_parser.py
          if ($LASTEXITCODE -ne 0) { throw 'CentrAsia parser tests failed' }

      - name: Run database self-test
        shell: pwsh
        run: |
          $server = Start-Process -FilePath 'python' -ArgumentList 'Kartoteka\server.py','--host','127.0.0.1','--port','8765' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($r.ok -eq $true -and $r.version -eq '1.2.0') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Source server did not start' }
            python Kartoteka\self_test.py
            if ($LASTEXITCODE -ne 0) { throw 'Database self-test failed' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build client EXE
        shell: pwsh
        run: |
          Set-Location Kartoteka
          pyinstaller --noconfirm --clean --windowed --onedir --name Kartoteka --collect-all openpyxl client.py

      - name: Build server EXE
        shell: pwsh
        run: |
          Set-Location Kartoteka
          pyinstaller --noconfirm --clean --console --onedir --name KartotekaServer server.py

      - name: Build uninstall EXE
        shell: pwsh
        run: |
          Set-Location Kartoteka
          pyinstaller --noconfirm --clean --windowed --onefile --name uninstall uninstall_launcher.py
          if (-not (Test-Path 'dist\uninstall.exe')) { throw 'uninstall.exe was not built' }

      - name: Verify Windows 7 runtime
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'Kartoteka\dist' -Recurse -Filter 'python37.dll'
          if (-not $runtime) { throw 'python37.dll not found in packaged apps' }
          Write-Host 'Python 3.7 runtime bundled for Windows 7 compatibility'

      - name: Smoke-test packaged server
        shell: pwsh
        run: |
          $exe = "$PWD\Kartoteka\dist\KartotekaServer\KartotekaServer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--host','127.0.0.1','--port','8765' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($r.ok -eq $true -and $r.version -eq '1.2.0') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Packaged server smoke test failed' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Download VC++ runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vc_redist.x64.exe' -OutFile 'Kartoteka\installer\VC_redist.x64.exe'
          if ((Get-Item 'Kartoteka\installer\VC_redist.x64.exe').Length -lt 1000000) { throw 'VC++ runtime download failed' }

      - name: Find Inno Setup
        id: inno
        shell: pwsh
        run: |
          $paths = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          Set-Location Kartoteka\installer
          & "${{ steps.inno.outputs.iscc }}" 'Kartoteka.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }

      - name: Verify final installer
        shell: pwsh
        run: |
          $setup = Get-Item 'Kartoteka\installer\output\Kartoteka_Setup_v1.2.0_Win7-11_x64.exe'
          if ($setup.Length -lt 10000000) { throw "Installer unexpectedly small: $($setup.Length)" }
          if (-not (Test-Path 'Kartoteka\dist\uninstall.exe')) { throw 'uninstall.exe missing' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer size: $([math]::Round($setup.Length / 1MB, 2)) MB"
          Write-Host "Installer SHA256: $hash"
          $hash | Out-File 'Kartoteka\installer\output\SHA256.txt' -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartoteka_Setup_v1.2.0_Win7-11_x64
          path: |
            Kartoteka/installer/output/Kartoteka_Setup_v1.2.0_Win7-11_x64.exe
            Kartoteka/dist/uninstall.exe
            Kartoteka/installer/output/SHA256.txt
          if-no-files-found: error
          retention-days: 30
